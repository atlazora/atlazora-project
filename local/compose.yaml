name: ${COMPOSE_PROJECT_NAME:-atlazora-local}

services:
  postgres:
    image: postgres:18.6
    container_name: atlazora-local-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlazora}
      POSTGRES_USER: ${POSTGRES_USER:-atlazora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlazora-local-only}

    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"

    volumes:
      - postgres-data:/var/lib/postgresql

    networks:
      - atlazora-local

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-atlazora} -d ${POSTGRES_DB:-atlazora}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s


  redis:
    image: redis:8.10.1-alpine
    container_name: atlazora-local-redis
    restart: unless-stopped

    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no"
      ]

    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"

    networks:
      - atlazora-local

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s


  s3:
    image: chrislusf/seaweedfs:4.45
    container_name: atlazora-local-s3
    restart: unless-stopped

    command:
      [
        "server",
        "-s3",
        "-s3.port=8333",
        "-s3.config=/etc/seaweedfs/s3.json",
        "-volume.max=0",
        "-master.volumeSizeLimitMB=100",
        "-master.telemetry=false"
      ]

    ports:
      - "127.0.0.1:${S3_PORT:-18333}:8333"

    volumes:
      - seaweed-data:/data
      - ./s3.json:/etc/seaweedfs/s3.json:ro

    networks:
      - atlazora-local

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--get",
          "http://localhost:8333/healthz"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s


networks:
  atlazora-local:
    name: atlazora-local
    driver: bridge


volumes:
  postgres-data:
    name: atlazora-local-postgres-data

  seaweed-data:
    name: atlazora-local-seaweed-data
