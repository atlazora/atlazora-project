name: Bug
description: Report a confirmed defect or incorrect behavior.
title: "[Bug] "
labels:
  - "type:bug"
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the defect clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe affected users, workflows, data, operations, or environments.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Local, Dev, Staging, Production, browser/client, version, commit, etc.
    validations:
      required: true

  - type: textarea
    id: security
    attributes:
      label: Security Impact
      description: State whether this has security implications. If yes, explain without exposing secrets.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs / Evidence
      description: Add safe logs, screenshots, traces, or reproduction evidence. Never include secrets.
    validations:
      required: false
